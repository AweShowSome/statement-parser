name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[test]"
      - run: pytest -q

  # The repository must never contain a bank statement. This fails the build if
  # a PDF, CSV or spreadsheet has ever been committed, on any branch, at any
  # point in history -- not merely if one is present in the current tree.
  no-financial-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan every commit for financial data
        run: |
          hits=$(git rev-list --objects --all \
                 | git cat-file --batch-check='%(objecttype) %(rest)' \
                 | awk '$1=="blob" {$1=""; print substr($0,2)}' \
                 | grep -iE '\.(pdf|csv|xlsx|xls|ofx|qfx)$' || true)
          if [ -n "$hits" ]; then
            echo "::error::financial-data file found in git history:"
            echo "$hits"
            exit 1
          fi
          echo "clean: no PDF/CSV/spreadsheet has ever been committed"
